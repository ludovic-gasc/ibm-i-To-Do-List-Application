openapi: 3.1.0
info:
  title: To-Do List API
  description: "REST API for managing to-do items — create, read, update status, and\
    \ delete todos."
  contact:
    name: Ludovic Gasc
    url: https://github.com/LudovicGasc/To-Do-List-Application
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Todos
  description: Operations for managing to-do items
paths:
  /todo/status/{id}/{status}:
    put:
      tags:
      - Todos
      summary: Update todo status
      description: Updates the done/pending status of a todo identified by its ID.
      operationId: updateTodoStatus
      parameters:
      - name: id
        in: path
        description: ID of the todo to update
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: status
        in: path
        description: "New status: true = done, false = pending"
        required: true
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: Status updated
          content:
            '*/*':
              schema:
                type: string
              examples:
                found:
                  description: found
                  value: "Status updated for id: 1"
                not found:
                  description: not found
                  value: Todo Id not Found
        "400":
          description: Invalid path parameter
          content:
            '*/*':
              schema:
                type: object
  /todo:
    post:
      tags:
      - Todos
      summary: Create a todo
      description: Adds a new todo item to the list.
      operationId: addTodo
      requestBody:
        description: Todo item to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Todo"
            examples:
              new todo:
                description: new todo
                value:
                  todoId: 3
                  name: Go for a run
                  todoDoneStatus: false
        required: true
      responses:
        "200":
          description: Todo created successfully
          content:
            '*/*':
              schema:
                type: string
              example: New Todo Added
        "400":
          description: Invalid request body
          content:
            '*/*':
              schema:
                type: object
  /todos:
    get:
      tags:
      - Todos
      summary: Get all todos
      description: Returns the complete list of todos regardless of their status.
      operationId: getAllTodos
      responses:
        "200":
          description: List of all todos
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
              examples:
                sample:
                  description: sample
                  value:
                  - todoId: 1
                    name: Buy groceries
                    todoDoneStatus: false
                  - todoId: 2
                    name: Read a book
                    todoDoneStatus: true
  /todo/pending:
    get:
      tags:
      - Todos
      summary: Get pending todos
      description: Returns only todos that are not yet done.
      operationId: notDoneTodos
      responses:
        "200":
          description: List of pending todos
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
              examples:
                sample:
                  description: sample
                  value:
                  - todoId: 1
                    name: Buy groceries
                    todoDoneStatus: false
  /todo/done:
    get:
      tags:
      - Todos
      summary: Get completed todos
      description: Returns only todos whose status is marked as done.
      operationId: getDoneTodos
      responses:
        "200":
          description: List of completed todos
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
              examples:
                sample:
                  description: sample
                  value:
                  - todoId: 2
                    name: Read a book
                    todoDoneStatus: true
  /todo/delete:
    delete:
      tags:
      - Todos
      summary: Delete a todo
      description: Removes a todo item from the list by its ID.
      operationId: removeTodo
      parameters:
      - name: id
        in: query
        description: ID of the todo to delete
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        "200":
          description: Todo deleted
          content:
            '*/*':
              schema:
                type: string
              examples:
                found:
                  description: found
                  value: Todo deleted
                not found:
                  description: not found
                  value: The Todo u want to delete does not exist
        "400":
          description: Missing or invalid id parameter
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    Todo:
      type: object
      description: Represents a to-do item
      properties:
        todoId:
          type: integer
          format: int32
          description: Unique identifier of the todo
          example: 1
        name:
          type: string
          description: Title or description of the todo
          example: Buy groceries
        todoDoneStatus:
          type: boolean
          description: "Completion status: true if done, false if pending"
          example: false
