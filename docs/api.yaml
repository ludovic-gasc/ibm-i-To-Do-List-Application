  /actuator/conditions:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'conditions'
      operationId: conditions
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/beans:
    get:
      tags:
      - Actuator
      summary: Actuator web endpoint 'beans'
      operationId: beans
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /todo/delete:
    delete:
      tags:
      - Todos
      summary: Delete a todo
      description: Removes a todo item from the list by its ID.
      operationId: removeTodo
      parameters:
      - name: id
        in: query
        description: ID of the todo to delete
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        "200":
          description: Todo deleted
          content:
            '*/*':
              schema:
                type: string
              examples:
                found:
                  description: found
                  value: Todo deleted
                not found:
                  description: not found
                  value: The Todo u want to delete does not exist
components:
  schemas:
    Todo:
      type: object
      description: Represents a to-do item
      properties:
        todoId:
          type: integer
          format: int32
          description: Unique identifier of the todo
          example: 1
        name:
          type: string
          description: Title or description of the todo
          example: Buy groceries
        todoDoneStatus:
          type: boolean
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
